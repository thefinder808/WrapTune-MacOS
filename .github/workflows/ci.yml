name: CI

# The release workflow only fires on v* tags, so without this the first
# automated test run of any change would happen at release time.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Independent verifier for the signing tests (mirrors release.yml).
      - name: Install osslsigncode (for signing tests)
        run: brew install osslsigncode

      - name: Test
        run: dotnet test --configuration Release
