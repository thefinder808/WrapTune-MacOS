name: CI

# The release workflow only fires on v* tags, so without this the first
# automated test run of any change would happen at release time.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A superseded run (new push to the same PR/branch) frees its macOS runner
# immediately instead of finishing a build nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    # Backstop only. The per-step timeouts below are sized to fire first, on
    # purpose: a step timeout fails the step and lets the job finish, so its
    # logs are retained. A *job* timeout cancels the run, and GitHub keeps no
    # logs for a cancelled run at all -- which is exactly why the 2026-07 and
    # 2026-08-04 hangs were never diagnosed.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Independent verifier for the signing tests (mirrors release.yml).
      - name: Install osslsigncode (for signing tests)
        run: brew install osslsigncode

      # These three were one `dotnet test` until 2026-08-04. That hid which
      # phase a hang was in: --blame-hang only watches test *execution*, so a
      # wedge in restore or build produced no dump, no failing test name, and
      # no named step -- an opaque 15-minute stall. Split so the guilty phase
      # identifies itself even if nothing else survives. Normal total is ~40s;
      # the budgets are deliberately loose so only a real wedge trips them.
      #
      # Deliberately NOT caching ~/.nuget/packages yet: restore is the leading
      # suspect, and a warm cache would mask the very phase we need to observe.
      # Revisit once a hang has been caught in a named step.
      - name: Restore
        timeout-minutes: 5
        run: dotnet restore --verbosity normal

      - name: Build
        timeout-minutes: 5
        run: dotnet build --configuration Release --no-restore

      # One step per test project, one after another.
      #
      # On 2026-11-20 the single `dotnet test` step wedged three times on PR #34
      # for 20+ minutes. Nothing inside the runner ended it — not blame-hang, not
      # the step timeout, not even watchdog.sh's own five-minute kill — and
      # GitHub kept no log for any of those runs. So the runner itself stops
      # executing or reporting, and the only thing that still reaches GitHub is
      # each step's status. Splitting makes that status say which project was
      # running. It also runs the projects serially instead of four test hosts
      # at once, which shows whether load is what tips the runner over.
      #
      # Each still runs under .github/scripts/watchdog.sh, for the hangs that
      # ARE ordinary: output goes to a file, and at 3 minutes it prints the
      # process list and the output so far before killing the tests. blame-hang
      # is 2m with dump collection off — it kills the test host and names the
      # running test without depending on a dump being written. A normal run
      # is a few seconds per project; every limit here is far above that.
      - name: "Test: Packaging"
        timeout-minutes: 4
        env:
          WATCHDOG_LOG: test-output-packaging.log
        run: >
          bash .github/scripts/watchdog.sh 180
          dotnet test tests/WrapTuneMacOS.Packaging.Tests
          --configuration Release --no-build
          --logger "console;verbosity=normal"
          --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type none

      - name: "Test: Cli"
        timeout-minutes: 4
        env:
          WATCHDOG_LOG: test-output-cli.log
        run: >
          bash .github/scripts/watchdog.sh 180
          dotnet test tests/WrapTuneMacOS.Cli.Tests
          --configuration Release --no-build
          --logger "console;verbosity=normal"
          --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type none

      - name: "Test: Signing"
        timeout-minutes: 4
        env:
          WATCHDOG_LOG: test-output-signing.log
        run: >
          bash .github/scripts/watchdog.sh 180
          dotnet test tests/WrapTuneMacOS.Signing.Tests
          --configuration Release --no-build
          --logger "console;verbosity=normal"
          --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type none

      - name: "Test: App"
        timeout-minutes: 4
        env:
          WATCHDOG_LOG: test-output-app.log
        run: >
          bash .github/scripts/watchdog.sh 180
          dotnet test tests/WrapTuneMacOS.App.Tests
          --configuration Release --no-build
          --logger "console;verbosity=normal"
          --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type none

      - name: Upload hang diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-hang-diagnostics
          path: |
            test-output-*.log
            **/TestResults/**/*.dmp
            **/TestResults/**/Sequence_*.xml
          if-no-files-found: ignore
